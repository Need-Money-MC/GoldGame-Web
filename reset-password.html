<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5c400">
<meta name="description" content="ساخت رمز عبور جدید">
<title>بازیابی رمز عبور | GoldGame</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/extra.css">
<script>document.documentElement.classList.add('js')</script>

</head>
<body>
<div class="shade"></div>
<header class="topbar">
<a class="brand" href="index.html"><img src="assets/logo.png" alt="GoldGame"><span>GOLD<span class="gold">GAME</span></span></a>
<button type="button" class="menu-btn" aria-label="باز کردن منو"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></button>
<nav aria-label="منوی اصلی"><a href="index.html">خانه</a><a href="shop.html">فروشگاه</a><a href="support.html">پشتیبانی</a><a href="rules.html">قوانین</a><a href="launcher.html">دانلود لانچر</a><a class=active href="auth.html">ورود / ثبت‌نام</a></nav>
<a class="nav-cta" href="support.html">پشتیبانی <span>←</span></a>
</header>
<main class="auth-wrap">
<section class="auth-card">
<span class="eyebrow"><i></i> بازیابی رمز عبور</span>
<h1>رمز عبور جدید</h1>
<p id="reset-info">در حال بررسی لینک بازیابی…</p>
<form id="reset-form" class="auth-form hidden" novalidate>
<div class="field"><label for="np1">رمز عبور جدید</label><input id="np1" class="ltr" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="حداقل ۸ کاراکتر"></div>
<div class="field"><label for="np2">تکرار رمز عبور جدید</label><input id="np2" class="ltr" type="password" autocomplete="new-password" maxlength="128"></div>
<button class="auth-submit" id="reset-submit" type="submit">ذخیره رمز جدید</button>
</form>
<div id="reset-msg" class="auth-note" role="status" aria-live="polite"></div>
<div class="auth-small"><a href="auth.html">بازگشت به ورود ←</a></div>
</section>
</main>
<footer>
<a class="brand footer-brand" href="index.html"><img src="assets/logo.png" alt=""><span>GOLD<span class="gold">GAME</span></span></a>
<p>یک ماجراجویی تازه، یک جامعه تازه.</p>

<small>© GoldGame — تمام حقوق محفوظ است.</small>
</footer>
<div class="toast" role="status"></div>
<script src="assets/app.js"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/gg-auth.js"></script>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const say = (t, bad) => { $('reset-msg').textContent = t || ''; $('reset-msg').classList.toggle('bad', !!bad); };
  let shown = false;
  const show = () => { if (shown) return; shown = true; $('reset-info').textContent = 'رمز عبور جدیدت را وارد کن.'; $('reset-form').classList.remove('hidden'); };
  try {
    const client = await GG.getClient();
    client.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY' || ev === 'SIGNED_IN') show(); });
    setTimeout(async () => {
      const { data: { session } } = await client.auth.getSession();
      if (session) show();
      else if (!shown) { $('reset-info').textContent = 'این لینک نامعتبر یا منقضی شده است. دوباره از صفحهٔ ورود «فراموشی رمز عبور» را بزن.'; }
    }, 1500);
    $('reset-form').addEventListener('submit', async e => {
      e.preventDefault(); say('');
      const a = $('np1').value, b = $('np2').value;
      if (a.length < 8) { say('رمز عبور باید حداقل ۸ کاراکتر باشد.', true); return; }
      if (a !== b) { say('رمز عبور و تکرار آن یکسان نیستند.', true); return; }
      $('reset-submit').disabled = true; say('در حال ذخیره…');
      try {
        const { error } = await client.auth.updateUser({ password: a });
        if (error) throw error;
        say('رمز عبور تغییر کرد ✅ در حال انتقال…');
        setTimeout(() => location.href = 'account.html', 1200);
      } catch (err) { say(GG.fa(err), true); $('reset-submit').disabled = false; }
    });
  } catch (err) { $('reset-info').textContent = GG.fa(err); }
})();
</script>
</body>
</html>
